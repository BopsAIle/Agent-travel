apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-flight-service
spec:
  replicas: 1
  strategy:
    type: Recreate 
  selector:
    matchLabels:
      app: travel-flight-service
  template:
    metadata:
      labels:
        app: travel-flight-service
    spec:
      containers:
        - name: flight-service
          image: berkayalkn/travel-flight-service:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql://travel:travel@travel-postgres:5432/travel_agent
            - name: PYTHONPATH
              value: /app
          envFrom:
            - secretRef:
                name: backend-secrets 
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: flight-service 
spec:
  selector:
    app: travel-flight-service
  ports:
    - protocol: TCP
      port: 8000 
      targetPort: 8000 
